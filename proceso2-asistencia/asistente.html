<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panel Asistente - Supabase</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="asistente-page">
    <div class="container">
      <!-- Header con reloj -->
      <div class="header">
        <h1>🏛️ SISTEMA DE ASISTENCIA</h1>
        <h2>Panel del Asistente</h2>
        <div class="reloj">
          <div class="reloj-tiempo" id="reloj">00:00:00</div>
          <div class="reloj-fecha" id="fecha">Cargando...</div>
          <div class="reloj-label">
            <span id="zona-horaria">Zona: America/Lima</span>
          </div>
        </div>
        <div class="badge-empleado" id="badgeEmpleado">
          Empleado: No registrado
        </div>
      </div>

      <div class="content">
        <!-- Botones principales -->
        <div class="botones-principales">
          <button class="btn-principal btn-entrada" onclick="abrirModalRegistro('entrada')">
            <span>✅ Marcar Entrada</span>
            <span class="btn-icon">↑</span>
          </button>

          <button class="btn-principal btn-salida" onclick="abrirModalRegistro('salida')">
            <span>❌ Marcar Salida</span>
            <span class="btn-icon">↓</span>
          </button>

          <button
            class="btn-principal btn-justificar"
            onclick="openModal('modalJustificar')"
          >
            <span>📝 Justificar Ausencia</span>
            <span class="btn-icon">📄</span>
          </button>
        </div>

        <!-- Geolocalización -->
        <div class="info-ubicacion" id="infoUbicacion">
          <span>📍</span>
          <span id="textoUbicacion">Ubicación no disponible</span>
        </div>

        <button
          class="btn-ubicacion"
          id="btnUbicacion"
          onclick="obtenerUbicacion()"
        >
          🧭 Actualizar Ubicación
        </button>

        <div id="mensaje" class="mensaje"></div>

        <!-- Cerrar sesión -->
        <button onclick="logout()" class="volver">🚪 Cerrar Sesión</button>
      </div>
    </div>

    <!-- MODAL JUSTIFICAR -->
    <div id="modalJustificar" class="modal">
      <div class="modal-content">
        <span class="close" onclick="closeModal('modalJustificar')"
          >&times;</span
        >
        <h2>📝 Enviar Justificación</h2>
        <form id="formJustificar">
          <div class="form-group">
            <label>Fecha de Ausencia</label>
            <input type="date" id="fechaJustifica" required />
          </div>
          <div class="form-group">
            <label>Motivo</label>
            <select id="motivoJustifica" required>
              <option value="Enfermedad">Enfermedad</option>
              <option value="Personal">Asunto Personal</option>
              <option value="Emergencia">Emergencia Familiar</option>
            </select>
          </div>
          <div class="form-group">
            <label>Descripción</label>
            <textarea
              id="descJustifica"
              class="form-group input"
              style="
                width: 100%;
                height: 80px;
                padding: 10px;
                border-radius: 10px;
                border: 2px solid #e5e7eb;
              "
              required
            ></textarea>
          </div>
          <div class="form-group">
            <label>Comprobante (Opcional)</label>
            <input
              type="file"
              id="archivoJustifica"
              onchange="previewArchivo(this)"
              accept="image/*,.pdf"
            />
            <img id="filePreview" class="file-preview" />
          </div>
          <div class="form-actions">
            <button type="submit" class="btn-submit">Enviar</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Modal de Registro de Asistencia (Movido desde index) -->
    <div id="modalAsistente" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('modalAsistente')">&times;</span>
            <h2>Registrar Asistencia</h2>
            <form id="formAsistencia">
                <div class="form-group">
                    <label for="nombre">Nombre del Empleado</label>
                    <input type="text" id="nombre" name="nombre" required>
                </div>

                <div class="form-group">
                    <label for="departamento">Departamento</label>
                    <select id="departamento" name="departamento" required>
                        <option value="">Seleccione...</option>
                        <option value="Ventas">Ventas</option>
                        <option value="Marketing">Marketing</option>
                        <option value="Desarrollo">Desarrollo</option>
                        <option value="Recursos Humanos">Recursos Humanos</option>
                        <option value="Finanzas">Finanzas</option>
                        <option value="Administración">Administración</option>
                        <option value="Operaciones">Operaciones</option>
                        <option value="Practicante">Practicante</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="fecha">Fecha</label>
                    <input type="date" id="fecha" name="fecha" required>
                </div>

                <div class="form-group">
                    <label>Tipo de Registro</label>
                    <div class="radio-group">
                        <label>
                            <input type="radio" id="regEntrada" name="tipo_registro" value="entrada" checked>
                            Entrada
                        </label>
                        <label>
                            <input type="radio" id="regSalida" name="tipo_registro" value="salida">
                            Salida
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="bloque">Bloque Horario</label>
                    <select id="bloque" name="bloque" required>
                        <option value="">Seleccione...</option>
                        <option value="Mañana (6am - 2pm)">Mañana (6am - 2pm)</option>
                        <option value="Tarde (2pm - 10pm)">Tarde (2pm - 10pm)</option>
                        <option value="Noche (10pm - 6am)">Noche (10pm - 6am)</option>
                    </select>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-submit">Registrar</button>
                    <button type="button" class="btn-cancel" onclick="closeModal('modalAsistente')">Cancelar</button>
                </div>
            </form>

            <div id="mensajeAsistencia" class="mensaje"></div>
        </div>
    </div>

    <button class="btn-tema" onclick="toggleTema()" id="btnTema">🌙</button>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="supabase.js"></script>
    <script src="common.js"></script>
    <script src="script.js"></script>
  </body>
</html>
