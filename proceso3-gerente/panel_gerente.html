<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panel Gerencial - Supabase</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
      .dashboard-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 30px;
        padding-bottom: 20px;
        border-bottom: 2px solid #e5e7eb;
      }

      .dashboard-header h1 {
        color: #2d3e50;
        font-size: 28px;
      }

      .btn-logout {
        padding: 10px 20px;
        background: #ef4444;
        color: white;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        font-weight: 600;
        transition: all 0.2s;
      }

      .btn-logout:hover {
        background: #dc2626;
        transform: translateY(-1px);
      }

      .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 20px;
        margin-bottom: 40px;
      }

      .stat-card {
        background: white;
        border-radius: 16px;
        padding: 25px;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        transition: all 0.3s;
      }

      .stat-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.15);
      }

      .stat-number {
        font-size: 36px;
        font-weight: 700;
        color: #7c3aed;
        margin-bottom: 5px;
      }

      .stat-label {
        color: #6b7280;
        font-size: 14px;
        font-weight: 500;
      }

      .section-title {
        color: #2d3e50;
        font-size: 22px;
        margin-bottom: 20px;
        font-weight: 600;
      }

      .table-container {
        background: white;
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        margin-bottom: 40px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      thead {
        background: #f8f9ff;
      }

      th {
        padding: 16px;
        text-align: left;
        font-weight: 600;
        color: #374151;
        border-bottom: 2px solid #e5e7eb;
      }

      td {
        padding: 16px;
        border-bottom: 1px solid #f3f4f6;
        color: #4b5563;
      }

      tr:hover {
        background: #f9fafb;
      }

      .status-badge {
        display: inline-block;
        padding: 4px 12px;
        border-radius: 9999px;
        font-size: 12px;
        font-weight: 600;
      }

      .status-entrada {
        background: #d1fae5;
        color: #065f46;
      }

      .status-salida {
        background: #fee2e2;
        color: #991b1b;
      }

      .btn-export {
        padding: 10px 20px;
        background: #10b981;
        color: white;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        font-weight: 600;
        margin-bottom: 20px;
        transition: all 0.2s;
      }

      .btn-export:hover {
        background: #059669;
      }

      .loading {
        text-align: center;
        padding: 40px;
        color: #6b7280;
      }

      .error-message {
        background: #fee2e2;
        color: #991b1b;
        padding: 16px;
        border-radius: 12px;
        margin-bottom: 20px;
      }

      .filters-grid {
        display: flex;
        gap: 15px;
        margin-bottom: 20px;
        flex-wrap: wrap;
      }

      .filters-grid input,
      .filters-grid select {
        padding: 10px 16px;
        border: 2px solid #e5e7eb;
        border-radius: 10px;
        font-size: 14px;
        background: #f9fafb;
      }

      .filters input:focus,
      .filters select:focus {
        outline: none;
        border-color: #7c3aed;
      }

      /* Modo oscuro */
      body.modo-oscuro .dashboard-header,
      body.modo-oscuro .stat-card,
      body.modo-oscuro .table-container,
      body.modo-oscuro .filters-section {
        background: rgba(30, 27, 75, 0.8);
      }

      body.modo-oscuro .dashboard-header h1,
      body.modo-oscuro .stat-label,
      body.modo-oscuro td,
      body.modo-oscuro .section-title {
        color: #e5e7eb;
      }

      body.modo-oscuro .stat-card {
        background: rgba(30, 27, 75, 0.6);
        border: 1px solid rgba(168, 85, 247, 0.2);
      }

      body.modo-oscuro .stat-number {
        color: #c084fc;
      }

      body.modo-oscuro thead {
        background: rgba(30, 27, 75, 0.5);
      }

      body.modo-oscuro th {
        background: rgba(30, 27, 75, 0.8);
        color: #e5e7eb;
        border-bottom-color: #4b5563;
      }

      body.modo-oscuro tr:hover {
        background: rgba(30, 27, 75, 0.5);
      }

      body.modo-oscuro .filters-grid input,
      body.modo-oscuro .filters-grid select {
        background: #374151;
        border-color: #4b5563;
        color: #e5e7eb;
      }

      body.modo-oscuro .btn-export,
      body.modo-oscuro .btn-logout {
        background: #7c3aed;
      }

      body.modo-oscuro .btn-export:hover,
      body.modo-oscuro .btn-logout:hover {
        background: #6d28d9;
      }

      /* =========================================== */
      /* NAVEGACIÓN RÁPIDA */
      /* =========================================== */

      .nav-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 18px;
        margin-bottom: 30px;
      }

      .nav-card {
        background: white;
        border-radius: 14px;
        padding: 20px;
        text-decoration: none;
        color: inherit;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0 sixth0.08);
        transition: all 0.3s;
        text-align: center;
        border: 2px solid transparent;
      }

      .nav-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
        border-color: #667eea;
      }

      .nav-icon {
        font-size: 32px;
        margin-bottom: 10px;
      }

      .nav-title {
        font-size: 16px;
        font-weight: 600;
        color: #2d3e50;
        margin-bottom: 4px;
      }

      .nav-desc {
        font-size: 12px;
        color: #6b7280;
      }

      body.modo-oscuro .nav-card {
        background: rgba(30, 30, 46, 0.7);
        border-color: rgba(102, 126, 234, 0.3);
      }

      body.modo-oscuro .nav-title {
        color: #e5e7eb;
      }

      body.modo-oscuro .nav-desc {
        color: #9ca3af;
      }
    </style>
  </head>
  <body class="panel-page index-page">
    <div class="container large" style="max-width: 1400px;">
        <!-- Header -->
        <div class="header" style="display: flex; justify-content: space-between; align-items: center; background: none; color: inherit; padding: 20px 0;">
            <h1 style="text-align: left; margin: 0;">
                Gerente General
                <span id="fechaHoyHeader" style="color: #666; font-size: 16px; font-weight: normal; margin-left: 10px;">• --/--/----</span>
            </h1>
            <div class="user-info">
                <span style="margin-right: 15px;">👤 <span id="nombreGerenteLogueado">Gerente</span></span>
                <button onclick="logout()" class="btn-logout" style="background: #dc3545; padding: 8px 16px; border-radius: 8px;">Cerrar sesión</button>
            </div>
        </div>

        <!-- Stats Grid -->
        <div class="stats-grid">
            <div class="stat-card presentes" style="border-left: 4px solid #28a745;">
                <h3 style="color: #666; font-size: 14px; text-transform: uppercase;">Presentes</h3>
                <div class="stat-number" id="statPresentes" style="color: #333;">0</div>
            </div>
            <div class="stat-card retardos" style="border-left: 4px solid #ffc107;">
                <h3 style="color: #666; font-size: 14px; text-transform: uppercase;">Tardanzas</h3>
                <div class="stat-number" id="statRetardos" style="color: #333;">00</div>
            </div>
            <div class="stat-card ausentes" style="border-left: 4px solid #dc3545;">
                <h3 style="color: #666; font-size: 14px; text-transform: uppercase;">Ausentes</h3>
                <div class="stat-number" id="statAusentes" style="color: #333;">00</div>
            </div>
            <div class="stat-card justificaciones" style="border-left: 4px solid #667eea;">
                <h3 style="color: #666; font-size: 14px; text-transform: uppercase;">Justificaciones</h3>
                <div class="stat-number" id="statJustificaciones" style="color: #333;">0</div>
            </div>
        </div>

        <!-- Acciones Rápidas -->
        <div class="acciones-rapidas" style="display: flex; gap: 10px; margin-bottom: 25px;">
            <button class="btn-principal" style="width: auto; padding: 10px 20px; font-size: 14px;" onclick="cargarDatos()">📋 Actualizar Datos</button>
            <button class="btn-principal btn-entrada" style="width: auto; padding: 10px 20px; font-size: 14px; border-radius: 10px;" onclick="exportarExcel()">📥 Descargar Excel</button>
        </div>

        <!-- Filtros -->
        <div class="filters-section" style="padding: 20px; border-radius: 15px; margin-bottom: 25px; box-shadow: 0 5px 15px rgba(0,0,0,0.05);">
            <div class="filters-header" style="margin-bottom: 15px;">
                <h2 style="font-size: 16px; color: #666;">🔍 Filtros y Búsqueda</h2>
            </div>
            <div class="filters-grid" style="display: flex; gap: 15px;">
                <input type="text" id="filtroNombre" placeholder="Buscar por nombre..." style="flex: 2;" oninput="cargarDatos()">
                <select id="filtroBloque" style="flex: 1;" onchange="cargarDatos()">
                    <option value="todos">Todos los Bloques</option>
                    <option value="Practicante">Practicante</option>
                    <option value="Oficina">Oficina</option>
                    <option value="Industrial">Industrial</option>
                </select>
                <input type="date" id="filtroFecha" onchange="cargarDatos()" style="flex: 1;">
            </div>
        </div>

        <!-- Tabla de Asistencias -->
        <div class="table-container">
            <table id="tablaAsistencias">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Empleado</th>
                        <th>Departamento</th>
                        <th>Bloque</th>
                        <th>Fecha</th>
                        <th>Entrada</th>
                        <th>Salida</th>
                        <th>Ubicación</th>
                        <th>Estado</th>
                    </tr>
                </thead>
                <tbody id="tbodyAsistencias">
                    <!-- Se llena con JS -->
                </tbody>
            </table>
            <div id="paginationInfo" style="padding: 15px; color: #666; font-size: 13px;">
                Cargando registros...
            </div>
        </div>

        <!-- Sección Justificaciones -->
        <h2 class="section-title" style="margin-top: 40px;">📝 Solicitudes de Justificación</h2>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Empleado</th>
                        <th>Fecha</th>
                        <th>Motivo</th>
                        <th>Descripción</th>
                        <th>Estado</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="tbodyJustificaciones">
                    <!-- Se llena con JS -->
                </tbody>
            </table>
        </div>
    </div>

    <button class="btn-tema" onclick="toggleTema()" id="btnTema">🌙</button>
    <script src="supabase.js"></script>
    <script src="common.js"></script>
    <script src="panel_gerente.js"></script>
  </body>
</html>
