<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Gerencial - Sistema de Asistencia</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #bdbec4 0%, #e2dfe6 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            transition: background 0.3s ease;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
            padding: 40px;
            animation: slideUp 0.5s ease;
            transition: background 0.3s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-size: 24px;
            color: #333;
            margin-bottom: 30px;
            font-weight: 600;
            text-align: center;
            border-bottom: 2px solid #667eea;
            padding-bottom: 15px;
        }

        .form-group { margin-bottom: 20px; }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 10px 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-login:hover {
            background: #5a67d8;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102,126,234,0.3);
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
        }

        .footer-links {
            margin-top: 25px;
            padding-top: 15px;
            border-top: 1px solid #e0e0e0;
            text-align: center;
        }

        .privacy-note { font-size: 11px; color: #999; margin-top: 15px; text-align: center; }

        /* MODO OSCURO */
        body.modo-oscuro { background: linear-gradient(135deg, #0f0c29 0%, #302b63 100%); }
        body.modo-oscuro .container { background: rgba(15, 12, 41, 0.95); }
        body.modo-oscuro h1 { color: #c084fc; border-bottom-color: #e94560; }
        body.modo-oscuro label { color: #c4b5fd; }
        body.modo-oscuro input { background: #1e1b4b; color: #f3e8ff; border-color: #7c3aed; }
        body.modo-oscuro .btn-login { background: linear-gradient(135deg, #7c3aed 0%, #a855f7 100%); }
    </style>
    <link rel="stylesheet" href="styles.css"> <!-- Para clases de mensajes y badges -->
</head>
<body class="login-page">
    <div class="container">
        <!-- SECCIÓN LOGIN -->
        <div id="loginSection">
            <h1>Acceso Gerencial</h1>
            <form id="formLogin">
                <div class="form-group">
                    <label>Usuario</label>
                    <input type="text" id="username" required placeholder="Ej: admin">
                </div>
                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>
                <div id="mensajeLogin" class="mensaje"></div>
                <button type="submit" class="btn-login">Ingresar</button>
            </form>
            <div class="footer-links">
                <a href="#" onclick="toggleAuth(true)" class="back-link">¿No tienes cuenta? Regístrate</a>
                <a href="index.html" class="back-link">← Volver al Inicio</a>
            </div>
        </div>

        <!-- SECCIÓN REGISTRO -->
        <div id="registerSection" style="display: none;">
            <h1>Crear Cuenta</h1>
            <form id="formRegister">
                <div class="form-group">
                    <label>Nombre Completo</label>
                    <input type="text" id="regNombre" required placeholder="Ej: Juan Pérez">
                </div>
                <div class="form-group">
                    <label>Usuario</label>
                    <input type="text" id="regUsername" required placeholder="Ej: jperez">
                </div>
                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" id="regPassword" required placeholder="Mínimo 6 caracteres">
                </div>
                <div id="mensajeRegister" class="mensaje"></div>
                <button type="submit" class="btn-login">Crear Cuenta</button>
            </form>
            <div class="footer-links">
                <a href="#" onclick="toggleAuth(false)" class="back-link">¿Ya tienes cuenta? Inicia Sesión</a>
                <a href="index.html" class="back-link">← Volver al Inicio</a>
            </div>
        </div>
        <p class="privacy-note">🔒 Acceso restringido para personal autorizado</p>
    </div>

    <button class="btn-tema" onclick="toggleTema()" id="btnTema">🌙</button>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script src="common.js"></script>
    <script src="login_gerente.js"></script>
</body>
</html>
